name: Daily Image Cleanup
on:
  schedule:
    - cron: '30 1 1 * *'
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          keep-n-tagged: 10
          exclude-tags: edge,latest
          delete-untagged: true
          delete-partial-images: true
